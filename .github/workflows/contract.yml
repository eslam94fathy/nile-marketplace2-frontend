# Contract suite (T-B7, design 01 §12.4): the backend at the commit pinned in backend.lock.json, started with
# its own docker compose (fake payment gateway, Mailpit), seeded, then `npm run test:contract` parses real
# responses with strict schemas from the corrected snapshot. No backend file is changed: the job only writes
# the backend's git-ignored .env for this throwaway stack.
# Needs the repository secret BACKEND_REPO_TOKEN: a read-only token for the backend repository (DQ-6).
name: Contract

on:
  pull_request:
    paths:
      - 'packages/api/**'
      - 'packages/test-utils/**'
      - 'backend.lock.json'
      - '.github/workflows/contract.yml'
  schedule:
    - cron: '0 2 * * *' # nightly, 04:00/05:00 Cairo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NILE_API_BASE_URL: http://localhost:3000
      MAILPIT_URL: http://localhost:8025
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      # Throwaway stack that lives only for this job: not a secret.
      E2E_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Pinned backend
        id: backend
        run: |
          echo "repo=$(jq -r .repo backend.lock.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit backend.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check the backend token
        env:
          BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if [ -z "$BACKEND_REPO_TOKEN" ]; then
            echo "::error::Repository secret BACKEND_REPO_TOKEN is missing (read-only token for ${{ steps.backend.outputs.repo }}, design 01 DQ-6)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.backend.outputs.repo }}
          ref: ${{ steps.backend.outputs.commit }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Values written first win: the backend's dev-env script only appends the keys still missing.
      # Strict-auth is raised because every account the suite creates signs up from the same IP.
      - name: Backend .env
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          PAYMENT_GATEWAY=fake
          EMAIL_PROVIDER=mailpit
          INVITE_URL_BASE=http://localhost:4100/invite
          KASHIER_REDIRECT_URL=http://localhost:4100/checkout/payment-return
          RATE_LIMIT_STRICT_AUTH_POINTS=1000
          EOF
          node scripts/dev-env.js

      - name: Backend stack
        working-directory: backend
        run: |
          docker compose up -d --build --wait postgres redis rabbitmq mailpit api worker
          timeout 60 sh -c 'until curl -fsS "$NILE_API_BASE_URL/health/ready" > /dev/null; do sleep 2; done'

      - name: Seed (sample catalog, test admin)
        working-directory: backend
        run: |
          npm ci
          npm run seed:dev
          docker compose run --rm --no-deps api node dist/seed-admin.js --email "$E2E_ADMIN_EMAIL"

      - name: Install
        run: npm ci

      - name: Contract tests
        run: npm run test:contract

      - name: Backend logs
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color --tail 300 api worker
